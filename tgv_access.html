<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS | THE GENTLE VARY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --white: #f5f3ef;
    --gray: #888;
  }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 20px 80px;
  }
  .section-header {
    text-align: center;
    margin-bottom: 48px;
  }
  .section-eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--white);
  }

  /* 地図エリア */
  .map-wrap {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto 48px;
  }
  .map-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ピン */
  .pin-link {
    cursor: pointer;
    text-decoration: none;
  }
  .pin-link:hover .pin-circle {
    fill: var(--gold-light);
  }


  /* 店舗情報カード */
  .stores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  .store-card {
    border: 1px solid rgba(201,168,76,0.3);
    padding: 24px 20px;
    text-decoration: none;
    color: var(--white);
    display: block;
    transition: border-color 0.3s, background 0.3s;
  }
  .store-card:hover {
    border-color: var(--gold);
    background: rgba(201,168,76,0.05);
  }
  .store-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  .store-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  .store-address {
    font-size: 11px;
    line-height: 1.8;
    color: rgba(245,243,239,0.7);
    margin-bottom: 16px;
  }
  .store-cta {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--black);
    background: var(--gold);
    padding: 8px 14px;
    font-weight: 500;
  }

  footer {
    text-align: center;
    padding: 40px 20px;
    border-top: 1px solid rgba(201,168,76,0.2);
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gray);
    margin-top: 60px;
  }

  @media (max-width: 480px) {
    .stores { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

      <!-- 凡例 -->

      <!-- 方位 -->

      <line x1="560" y1="35" x2="560" y2="50" stroke="#555" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- 店舗カード -->
  <div class="stores">
    <a class="store-card" href="https://maps.app.goo.gl/fQ3Gk8c633yNArvx8?g_st=ic" target="_blank">

      <span class="store-cta">📍 Google Mapで開く →</span>

  </div>
</main>
